name: Release

on:
  push:
    tags:
      # SemVer tags that match the version in pyproject.toml (e.g. 0.1.0)
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-llmstxt/
    permissions:
      id-token: write # mandatory for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: uv run --locked --group test pytest

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
